name: persona
services:
  db:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: persona
      POSTGRES_USER: persona
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [persona-db:/var/lib/postgresql/data]
    networks: [data]
    read_only: true
    tmpfs: [/tmp, /run/postgresql]
    security_opt: [no-new-privileges:true]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U persona"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  api:
    build: ./backend
    secrets: [jwt_secret, database_url]
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
          ],
        interval: 5s,
        timeout: 3s,
        retries: 12,
      }
  web:
    build: ./frontend
    ports: ["8080:8080"]
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    security_opt: [no-new-privileges:true]
    depends_on: { api: { condition: service_healthy } }
volumes:
  persona-db:
networks:
  edge:
  data:
    internal: true
secrets:
  db_password: { file: ./secrets/db_password.txt }
  jwt_secret: { file: ./secrets/jwt_secret.txt }
  database_url: { file: ./secrets/database_url.txt }
services:
  privileged-worker:
    image: alpine:3.21
    user: "0:0"
    privileged: true
    command: ["sh", "-c", "sleep infinity"]
