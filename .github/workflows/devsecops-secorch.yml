name: DevSecOps Pipeline (secorch)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checks: ${{ steps.secorch.outputs.checks }}
      risk_level: ${{ steps.secorch.outputs.risk_level }}
      report: ${{ steps.secorch.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-suffix: secorch-0.1.0
      - run: uvx --from "secorch==0.1.0" secorch init --force
      - id: secorch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uvx --from "secorch==0.1.0" secorch analyze --report artifacts/secorch-report.pdf
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secorch-decision-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

  security:
    needs: orchestrate
    uses: ./.github/workflows/security-checks.yml
    with:
      secret_scanning: ${{ fromJSON(needs.orchestrate.outputs.checks).secret_scanning }}
      sca: ${{ fromJSON(needs.orchestrate.outputs.checks).sca }}
      sast: ${{ fromJSON(needs.orchestrate.outputs.checks).sast }}
      iac_scanning: ${{ fromJSON(needs.orchestrate.outputs.checks).iac_scanning }}
      container_scanning: ${{ fromJSON(needs.orchestrate.outputs.checks).container_scanning }}
      dast: ${{ fromJSON(needs.orchestrate.outputs.checks).dast }}
