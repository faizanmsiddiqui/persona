[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.6",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.41",
  "alembic==1.16.4",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "PyJWT==2.13.0",
  "bleach==6.4.0",
  "weasyprint==69.0",
  "jinja2==3.1.6",
  "requests==2.34.2",
  "urllib3==1.26.5", # Intentionally vulnerable SCA scanner fixture.
  "email-validator==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "httpx==0.28.1", "pytest-cov==6.2.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
