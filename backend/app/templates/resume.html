<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      {{ css }}
    </style>
    <style>
      :root{--accent:{{ accent }}}
    </style>
  </head>
  <body>
    <header>
      <h1>{{ basics.name }}</h1>
      <p class="headline">{{ basics.headline }}</p>
      <p>{{ basics.email or "" }} {{ basics.phone }}</p>
      <p>{{ basics.summary }}</p>
    </header>
    {% for section in sections %}
    <section class="section">
      <h2>{{ section.title }}</h2>
      {% for item in section["items"] %}
      <article>
        <strong>{{ item.title }}</strong> {{ item.subtitle }}
        <p>{{ item.description }}</p>
      </article>
      {% endfor %}
    </section>
    {% endfor %}
  </body>
</html>
